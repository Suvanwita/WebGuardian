<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGuardian</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-hover: #0ea5e9;
      --border-color: #334155;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--accent-color), #818cf8);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #0f172a;
    }

    h1 {
      font-size: 1.1rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: #10b981;
    }

    .description {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
      margin: 0;
    }

    button {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-icon">W</div>
        <h1>WebGuardian</h1>
      </div>
      <span class="status-badge">Active</span>
    </header>
    <main>
      <div class="status-card">
        <div class="card-title">Security Engine</div>
        <div class="card-value">Shield Active</div>
      </div>
      <p class="description">
        WebGuardian is actively monitoring web requests and navigating securely to protect your local browsing experience.
      </p>
      <button id="open-dashboard">Open Dashboard</button>
    </main>
  </div>
</body>
</html>
