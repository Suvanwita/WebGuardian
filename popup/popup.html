<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGuardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-icon">W</div>
        <h1>WebGuardian</h1>
      </div>
      <span class="status-badge" id="status-text">Active</span>
    </header>
    
    <main>
      <div class="score-card">
        <div class="score-circle-container">
          <svg class="score-circle" width="100" height="100" viewBox="0 0 100 100">
            <circle class="score-circle-bg" cx="50" cy="50" r="44" />
            <circle id="score-progress" class="score-circle-progress" cx="50" cy="50" r="44" />
          </svg>
          <div class="score-text-container">
            <span id="score-value">0</span>
            <span class="score-label">RISK</span>
          </div>
        </div>
        <div id="risk-status" class="risk-status safe">Low Risk</div>
      </div>

      <div class="threats-section">
        <h2 class="section-title">Detected Issues</h2>
        <div id="threats-list" class="threats-list">
          <!-- Populated dynamically by popup.js -->
        </div>
      </div>

      <div class="info-footer">
        <span class="info-label">Active Host:</span>
        <span id="active-url" class="info-value">Loading...</span>
      </div>

      <button id="open-dashboard">Open Security Dashboard</button>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
